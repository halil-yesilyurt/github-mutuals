name: One-time dependency lockfile repair
on:
  push:
    branches:
      - security/oauth-firestore-hardening
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'halil-yesilyurt/github-mutuals' && github.ref == 'refs/heads/security/oauth-firestore-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/oauth-firestore-hardening
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh lockfile to patched compatible versions
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          git diff --check
      - name: Save compatible lockfile fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): refresh vulnerable transitive dependency lockfile'
            git push origin HEAD:security/oauth-firestore-hardening
          fi
      - name: Check remaining issues (informational)
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run build
          npm audit --audit-level=high
