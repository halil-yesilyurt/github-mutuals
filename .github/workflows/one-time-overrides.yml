name: One-time validate dependency overrides
on:
  push:
    branches: [security/oauth-firestore-hardening]
permissions:
  contents: write
jobs:
  validate-and-save:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/oauth-firestore-hardening
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Check dependency tree and application
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Commit lockfile once verified
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): lock verified security overrides'
            git push origin HEAD:security/oauth-firestore-hardening
          fi
